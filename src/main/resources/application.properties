spring.application.name=coursehub

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/coursehub_db
spring.datasource.username=root
spring.datasource.password=sd@mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Error responses: show the message, never a stack trace
spring.web.error.include-message=always
spring.web.error.include-stacktrace=never

# Reject decimals for whole-number fields (for example rating 4.5), instead of silently cutting them to 4
spring.jackson.deserialization.accept-float-as-int=false

# Multipart upload limits
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# File storage (project root ./upload, outside src and target)
app.storage.video-dir=./upload/videos
app.storage.material-dir=./upload/materials

# Allowed file types (extensions, comma separated)
app.storage.allowed-video-extensions=mp4,webm,mkv,mov
app.storage.allowed-material-extensions=pdf,docx,pptx,xlsx,txt

# Maximum size of one course material file, in MB
app.storage.max-material-size-mb=50

# Pagination
app.pagination.default-page-size=10
app.pagination.max-page-size=50

# JWT (HS256 secret, at least 32 characters; token valid for the given hours)
app.jwt.secret=664bc4ddede73b6e3c5daa5b4d598b037e9154fc7fa964d6879a11ca7f15a0fe
app.jwt.expiration-hours=24

# Default admin account, created at startup by DataInitializer if it does not exist
app.admin.full-name=CourseHub Admin
app.admin.email=admin@coursehub.com
app.admin.password=Admin@12345